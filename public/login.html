<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin Logins — Jonathan & Maribel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="images/monogram.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap');
    @font-face{font-family:'Quill Std';src:url('fonts/QuillStd.woff2') format('woff2')}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:linear-gradient(135deg,#1a1a12 0%,#2c2c1e 60%,#1a1a12 100%);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Jost',sans-serif}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 40%,rgba(107,142,176,.12) 0%,transparent 70%)}
    .login-box{position:relative;width:min(400px,100%);background:rgba(248,245,236,.04);border:1px solid rgba(184,208,227,.15);border-radius:24px;padding:48px 36px;backdrop-filter:blur(12px);box-shadow:0 24px 60px rgba(0,0,0,.4);animation:fadeUp .8s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .login-brand{text-align:center;margin-bottom:40px}
    .login-brand .script{font-family:'Quill Std',cursive;font-size:2.4rem;color:#B8D0E3;display:block;margin-bottom:4px}
    .login-brand small{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(184,208,227,.4)}
    .form-group{margin-bottom:20px}
    label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(184,208,227,.6);margin-bottom:8px}
    .input-wrap{position:relative}
    input{width:100%;padding:14px 48px 14px 16px;background:rgba(255,255,255,.05);border:1.5px solid rgba(184,208,227,.15);border-radius:12px;font-family:'Jost',sans-serif;font-size:.9rem;color:#f8f5ec;outline:none;transition:all .3s ease}
    input:focus{border-color:rgba(107,142,176,.6);background:rgba(255,255,255,.07);box-shadow:0 0 0 3px rgba(107,142,176,.1)}
    input::placeholder{color:rgba(248,245,236,.25)}
    .input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(184,208,227,.3);font-size:.9rem;cursor:pointer}
    .error-msg{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.25);color:#ff9e8e;padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:20px;display:flex;align-items:center;gap:8px}
    .login-btn{width:100%;padding:15px;background:linear-gradient(135deg,#6B8EB0,#4A6D8C);border:none;border-radius:12px;color:white;font-family:'Jost',sans-serif;font-size:.9rem;font-weight:500;letter-spacing:.08em;cursor:pointer;transition:all .3s ease;box-shadow:0 4px 20px rgba(107,142,176,.3)}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(107,142,176,.4)}
    .login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .back-link{display:block;text-align:center;margin-top:20px;font-size:.78rem;color:rgba(184,208,227,.4);text-decoration:none;transition:color .3s ease}
    .back-link:hover{color:rgba(184,208,227,.7)}
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-brand">
    <span class="script">Jonathan &amp; Maribel</span>
    <small>Admin Portal</small>
  </div>
  <div class="error-msg" id="error-msg" style="display:none">
    <i class="fa-solid fa-circle-exclamation"></i><span id="error-text"></span>
  </div>
  <div class="form-group">
    <label>Username</label>
    <div class="input-wrap">
      <input type="text" id="username" placeholder="Enter username" autocomplete="username">
      <i class="fa-solid fa-user input-icon"></i>
    </div>
  </div>
  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      <i class="fa-solid fa-eye input-icon" id="pwd-toggle" onclick="togglePwd()"></i>
    </div>
  </div>
  <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>
  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Invitation</a>
</div>
<script>
fetch('/api/auth_check').then(r=>r.json()).then(d=>{if(d.authenticated)window.location.href='admin.html';}).catch(()=>{});
function togglePwd(){const f=document.getElementById('password'),i=document.getElementById('pwd-toggle');if(f.type==='password'){f.type='text';i.className='fa-solid fa-eye-slash input-icon';}else{f.type='password';i.className='fa-solid fa-eye input-icon';}}
async function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('login-btn');
  const errEl=document.getElementById('error-msg');
  const errText=document.getElementById('error-text');
  errEl.style.display='none';
  if(!username||!password){errText.textContent='Please enter username and password.';errEl.style.display='flex';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(data.success){window.location.href='admin.html';}
    else{errText.textContent=data.message||'Login failed.';errEl.style.display='flex';btn.disabled=false;btn.textContent='Sign In';}
  }catch{errText.textContent='Network error. Please try again.';errEl.style.display='flex';btn.disabled=false;btn.textContent='Sign In';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
