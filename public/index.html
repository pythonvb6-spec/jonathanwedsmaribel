<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Jonathan & Maribel — Wedding Invitation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/monogram.png">
  <style>
    @font-face {
      font-family: 'Quill Std';
      src: url('fonts/QuillStd.woff2') format('woff2'),
           url('fonts/QuillStd.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #2a2a1e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(107,142,176,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(166,124,82,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(50,48,30,0.8) 0%, transparent 100%);
      z-index: 0;
    }

    .floating-petals {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .petal {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: fallDown linear infinite;
    }
    @keyframes fallDown {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .invitation-card {
      position: relative; z-index: 10;
      width: min(400px, 92vw);
      background: linear-gradient(160deg, #fdfcf7 0%, #f8f5ec 50%, #f3ede0 100%);
      border-radius: 4px;
      box-shadow:
        0 0 0 1px rgba(166,124,82,0.2),
        0 20px 60px rgba(0,0,0,0.5),
        0 4px 16px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.9);
      padding: 50px 36px 44px;
      text-align: center;
      animation: cardReveal 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-border {
      position: absolute; inset: 10px;
      border: 1px solid rgba(166,124,82,0.25);
      border-radius: 3px; pointer-events: none;
    }
    .card-corner {
      position: absolute; width: 18px; height: 18px;
      border-color: #A67C52; border-style: solid; opacity: 0.5;
    }
    .card-corner.tl { top: 14px; left: 14px; border-width: 1.5px 0 0 1.5px; }
    .card-corner.tr { top: 14px; right: 14px; border-width: 1.5px 1.5px 0 0; }
    .card-corner.bl { bottom: 14px; left: 14px; border-width: 0 0 1.5px 1.5px; }
    .card-corner.br { bottom: 14px; right: 14px; border-width: 0 1.5px 1.5px 0; }

    .card-top-text {
      font-family: 'Jost', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: #A67C52;
      margin-bottom: 20px; animation: fadeUp 1s 0.4s both;
    }
    .card-pretext {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-size: 1rem;
      color: #8a7055; margin-bottom: 6px;
      animation: fadeUp 1s 0.5s both;
    }
    .couple-names {
      font-family: 'Quill Std', 'Great Vibes', cursive;
      font-size: clamp(2.8rem, 10vw, 3.6rem);
      color: #3d3520; line-height: 1.1;
      margin-bottom: 6px; animation: fadeUp 1s 0.6s both;
    }
    .name-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin: 4px 0; animation: fadeUp 1s 0.65s both;
    }
    .name-divider::before, .name-divider::after {
      content: ''; flex: 1; height: 1px;
    }
    .name-divider::before { background: linear-gradient(to right, transparent, rgba(166,124,82,0.4)); }
    .name-divider::after  { background: linear-gradient(to left, transparent, rgba(166,124,82,0.4)); }
    .name-divider span {
      font-family: 'Cormorant Garamond', serif; font-size: 0.75rem;
      color: #A67C52; letter-spacing: 0.2em;
    }
    .wedding-date {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.85rem; letter-spacing: 0.15em;
      color: #8a7055; margin: 18px 0 32px;
      animation: fadeUp 1s 0.7s both;
    }

    .wax-seal-btn {
      display: inline-flex; flex-direction: column;
      align-items: center; gap: 14px;
      background: none; border: none; cursor: pointer;
      animation: fadeUp 1s 0.8s both;
      transition: transform 0.3s ease;
    }
    .wax-seal-btn:hover { transform: scale(1.05); }
    .wax-seal-btn:hover .seal-circle {
      box-shadow:
        0 0 0 3px rgba(166,124,82,0.55),
        0 0 0 7px rgba(166,124,82,0.15),
        0 16px 48px rgba(0,0,0,0.38);
    }
    .wax-seal-btn:active { transform: scale(0.97); }
    .seal-circle {
      width: 100px; height: 100px;
      border-radius: 50%; overflow: hidden;
      box-shadow:
        0 0 0 2px rgba(166,124,82,0.35),
        0 0 0 5px rgba(166,124,82,0.1),
        0 10px 32px rgba(0,0,0,0.28);
      transition: box-shadow 0.3s ease;
    }
    .seal-circle img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .seal-tap-text {
      font-family: 'Jost', sans-serif; font-size: 0.65rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: #A67C52;
      display: flex; align-items: center; gap: 8px;
    }
    .seal-tap-text::before, .seal-tap-text::after {
      content: ''; display: block; width: 22px; height: 1px;
      background: rgba(166,124,82,0.45);
    }

    @keyframes pulseRing {
      0%   { transform: scale(1);    opacity: 0.55; }
      70%  { transform: scale(1.28); opacity: 0; }
      100% { transform: scale(1.28); opacity: 0; }
    }
    .seal-circle {
      position: relative;
    }
    .seal-circle::after {
      content: '';
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(166,124,82,0.6);
      animation: pulseRing 2.2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Curtain */
    @keyframes curtainSway {
      0%   { background-position: 0 0; }
      50%  { background-position: 8px 0; }
      100% { background-position: 0 0; }
    }
    @keyframes curtainShimmer {
      0%, 100% { opacity: 0.55; }
      50%       { opacity: 0.75; }
    }
    .curtain-panel {
      position: fixed; top: 0; width: 52%; height: 100%; z-index: 9999;
      transition: transform 1.3s cubic-bezier(0.77, 0, 0.18, 1);
      overflow: hidden; filter: drop-shadow(0 0 32px rgba(44,80,120,0.35));
    }
    .curtain-panel::before {
      content: ''; position: absolute; inset: 0;
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,0.22) 0px, rgba(255,255,255,0.06) 10px, rgba(0,0,0,0.14) 22px, rgba(255,255,255,0.04) 34px, rgba(0,0,0,0.20) 46px),
        linear-gradient(160deg, #3d5e78 0%, #6B8EB0 28%, #4f759b 55%, #345c80 80%, #213d5e 100%);
      animation: curtainSway 4s ease-in-out infinite;
    }
    .curtain-panel::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 22px;
      background: linear-gradient(180deg, #f0d060 0%, #f5e080 25%, #d4a843 55%, #b8872a 80%, #8a5e18 100%);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.5); z-index: 2;
    }
    .curtain-inner {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0px, rgba(0,0,0,0.28) 5px, transparent 12px, rgba(255,255,255,0.07) 18px, transparent 26px, rgba(0,0,0,0.14) 32px, transparent 40px);
      animation: curtainShimmer 3s ease-in-out infinite; pointer-events: none;
    }
    .curtain-fringe {
      position: absolute; bottom: 0; left: 0; right: 0; height: 52px;
      background: repeating-linear-gradient(90deg, #d4a843 0px, #d4a843 5px, #f0c94a 5px, #f0c94a 7px, transparent 7px, transparent 14px);
      mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 30%, black 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 30%, black 100%);
      opacity: 0.9;
    }
    .curtain-trim {
      position: absolute; top: 22px; bottom: 0; width: 8px;
      background: linear-gradient(180deg, #f5e080 0%, #d4a843 30%, #b8872a 70%, #8a5e18 100%);
      box-shadow: 0 0 12px rgba(212,168,67,0.6); z-index: 2;
    }
    .curtain-left  { left: 0;  transform: translateX(-100%); }
    .curtain-left  .curtain-trim { right: 0; }
    .curtain-right { right: 0; transform: translateX(100%); }
    .curtain-right .curtain-trim { left: 0; }
    .curtain-left.close  { transform: translateX(0); }
    .curtain-right.close { transform: translateX(0); }
  </style>
</head>
<body>

<div class="floating-petals" id="petals"></div>

<div class="invitation-card">
  <div class="card-border"></div>
  <div class="card-corner tl"></div><div class="card-corner tr"></div>
  <div class="card-corner bl"></div><div class="card-corner br"></div>

  <p class="card-top-text">Wedding Invitation</p>
  <p class="card-pretext">In God’s love and perfect will, He has called us to become one in Christ.</p>

  <div class="couple-names">Jonathan</div>
  <div class="name-divider"><span>&amp;</span></div>
  <div class="couple-names">Maribel</div>

  <p class="wedding-date">June 12, 2026 &nbsp;·&nbsp; 5:00 PM&nbsp;·&nbsp; <br> Regina's Garden & Restaurant</p>

  <button class="wax-seal-btn" onclick="openInvitation()">
    <div class="seal-circle">
      <img src="images/monogram circle.png" alt="J&M monogram">
    </div>
    <span class="seal-tap-text">Tap to open</span>
  </button>
</div>

<div class="curtain-panel curtain-left" id="curtain-left">
  <div class="curtain-inner"></div><div class="curtain-trim"></div><div class="curtain-fringe"></div>
</div>
<div class="curtain-panel curtain-right" id="curtain-right">
  <div class="curtain-inner"></div><div class="curtain-trim"></div><div class="curtain-fringe"></div>
</div>

<script>
// Floating petals
const petalColors = ['#B8D0E3','#d4a574','#b8c882','#e8c9a0','#6B8EB0'];
const petalsEl = document.getElementById('petals');
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.classList.add('petal');
  p.style.cssText = `
    left: ${Math.random()*100}%;
    background: ${petalColors[Math.floor(Math.random()*petalColors.length)]};
    width: ${4+Math.random()*6}px; height: ${4+Math.random()*6}px;
    animation-duration: ${6+Math.random()*8}s;
    animation-delay: ${-Math.random()*10}s;
    border-radius: ${Math.random()>0.5?'50% 0 50% 0':'50%'};
  `;
  petalsEl.appendChild(p);
}

function openInvitation() {
  document.getElementById('curtain-left').classList.add('close');
  document.getElementById('curtain-right').classList.add('close');
  setTimeout(() => { window.location.href = 'invitation.html'; }, 680);
}
</script>
</body>
</html>
